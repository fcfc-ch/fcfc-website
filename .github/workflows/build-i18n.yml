name: Build language versions

on:
  push:
    branches: [main]
    paths:
      - index.html
      - translations/**
      - scripts/build_i18n.py
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: site-data-commit
  cancel-in-progress: false

jobs:
  build-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements-i18n.txt

      - name: Build DE / FR / IT pages
        run: python scripts/build_i18n.py

      - name: Commit and push if pages changed
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "Automated rebuild of language versions"
          file_pattern: de/index.html fr/index.html it/index.html
